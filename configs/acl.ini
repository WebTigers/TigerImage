; TigerImage ACL — admin-gated, like every other content-mutating surface.
; Discovery is authorization: a role that cannot see these resources gets no MCP tool for them either.
;
; Format matches every core module (Tiger_Acl_Acl): declare each resource, then a rule per role.
; NOT `acl.resources.<Class>.allow.<role>` — that shape registers nothing (the bug through 1.0.4).
[production]
acl.resources.tigerimage_image_svc.resource   = "Tigerimage_Service_Image"
acl.resources.tigerimage_library_svc.resource = "Tigerimage_Service_Library"
acl.resources.tigerimage_studio_ctrl.resource = "Tigerimage_StudioController"

acl.rules.tigerimage_image_admin.role       = "admin"
acl.rules.tigerimage_image_admin.resource   = "Tigerimage_Service_Image"
acl.rules.tigerimage_image_admin.permission = "allow"
acl.rules.tigerimage_image_dev.role         = "developer"
acl.rules.tigerimage_image_dev.resource     = "Tigerimage_Service_Image"
acl.rules.tigerimage_image_dev.permission   = "allow"

acl.rules.tigerimage_library_admin.role       = "admin"
acl.rules.tigerimage_library_admin.resource   = "Tigerimage_Service_Library"
acl.rules.tigerimage_library_admin.permission = "allow"
acl.rules.tigerimage_library_dev.role         = "developer"
acl.rules.tigerimage_library_dev.resource     = "Tigerimage_Service_Library"
acl.rules.tigerimage_library_dev.permission   = "allow"

acl.rules.tigerimage_studio_admin.role       = "admin"
acl.rules.tigerimage_studio_admin.resource   = "Tigerimage_StudioController"
acl.rules.tigerimage_studio_admin.permission = "allow"
acl.rules.tigerimage_studio_dev.role         = "developer"
acl.rules.tigerimage_studio_dev.resource     = "Tigerimage_StudioController"
acl.rules.tigerimage_studio_dev.permission   = "allow"

[staging : production]
[testing : production]
[development : production]
