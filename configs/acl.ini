; TigerImage ACL — admin-gated, like every other content-mutating surface.
; Discovery is authorization: a role that cannot see these resources gets no MCP tool for them either.
[production]
acl.resources.Tigerimage_Service_Image.allow.admin     = "*"
acl.resources.Tigerimage_Service_Image.allow.developer = "*"
acl.resources.Tigerimage_Service_Library.allow.admin     = "*"
acl.resources.Tigerimage_Service_Library.allow.developer = "*"
