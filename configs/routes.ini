; TigerImage routes. The studio is an admin screen; `raw` streams a private image through the ACL.
[production]
routes.tigerimage_studio.route      = "tigerimage/studio"
routes.tigerimage_studio.defaults.module     = "tigerimage"
routes.tigerimage_studio.defaults.controller = "studio"
routes.tigerimage_studio.defaults.action     = "index"

routes.tigerimage_raw.route      = "tigerimage/studio/raw/id/:id"
routes.tigerimage_raw.defaults.module     = "tigerimage"
routes.tigerimage_raw.defaults.controller = "studio"
routes.tigerimage_raw.defaults.action     = "raw"
