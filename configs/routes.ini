; TigerImage routes. The studio is an admin screen; `raw` streams a private image through the ACL.
[production]
resources.router.routes.tigerimage_studio.route      = "tigerimage/studio"
resources.router.routes.tigerimage_studio.defaults.module     = "tigerimage"
resources.router.routes.tigerimage_studio.defaults.controller = "studio"
resources.router.routes.tigerimage_studio.defaults.action     = "index"

resources.router.routes.tigerimage_raw.route      = "tigerimage/studio/raw/id/:id"
resources.router.routes.tigerimage_raw.defaults.module     = "tigerimage"
resources.router.routes.tigerimage_raw.defaults.controller = "studio"
resources.router.routes.tigerimage_raw.defaults.action     = "raw"

; Every Tiger ini must declare all four env sections so the per-file Zend_Config_Ini($file, $env)
; load can't hit a missing section (ARCHITECTURE §5). Non-prod envs inherit production's routes.
[staging : production]

[testing : production]

[development : production]
